# Production: copy to /opt/docker/slicefall on the server, next to deploy.sh and .env
services:
  slicefall:
    image: ghcr.io/gdainti/slicefall:${TAG:-latest}
    container_name: slicefall
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    networks:
      - internet-grid
    # The app writes only to /data (and SQLite may use /tmp), and needs no Linux capabilities
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  internet-grid:
    external: true
