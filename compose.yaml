# Production: copy to /opt/docker/slicefall on the server, next to deploy.sh and .env
services:
  slicefall:
    image: ghcr.io/gdainti/nottetris2-web:${TAG:-latest}
    container_name: slicefall
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    networks:
      - internet-grid
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  internet-grid:
    external: true
