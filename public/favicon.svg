<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The logo in miniature: stripes in the piece colours (red to purple, like the letters of
       SLICEFALL), sliced along the same diagonal, the lower half dropped. -->
  <defs>
    <clipPath id="tile"><rect x="2" y="2" width="28" height="26" rx="5" /></clipPath>
    <clipPath id="above"><polygon points="0,0 32,0 32,13 0,18" /></clipPath>
    <clipPath id="below"><polygon points="0,21 32,16 32,32 0,32" /></clipPath>
    <g id="stripes">
      <rect x="2" y="2" width="4" height="26" fill="#f0444f" />
      <rect x="6" y="2" width="4" height="26" fill="#ff8c2e" />
      <rect x="10" y="2" width="4" height="26" fill="#ffd23f" />
      <rect x="14" y="2" width="4" height="26" fill="#5fd35b" />
      <rect x="18" y="2" width="4" height="26" fill="#2fd4d4" />
      <rect x="22" y="2" width="4" height="26" fill="#4a78ff" />
      <rect x="26" y="2" width="4" height="26" fill="#b452e8" />
    </g>
  </defs>
  <g clip-path="url(#above)"><g clip-path="url(#tile)"><use href="#stripes" /></g></g>
  <g transform="translate(1 3)"><g clip-path="url(#below)"><g clip-path="url(#tile)"><use href="#stripes" /></g></g></g>
</svg>
